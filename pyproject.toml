[project]
name = "videollm-online"
version = "0.0.0"
description = "Online Video LLM for streaming video."
readme = "README.md"
requires-python = "==3.10.19"
dependencies = [
  "accelerate==1.12.0",
  "antlr4-python3-runtime==4.9.3",
  "cython==3.2.4",
  "deepspeed==0.18.5",
  "encodec==0.1.1",
  "editdistance==0.8.1",
  "gradio==6.5.1",
  "Levenshtein==0.27.3",
  "moviepy==2.2.1",
  "peft==0.18.1",
  "submitit==1.5.4",
  "tensorboard==2.20.0",
  "transformers==4.55.4",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "torchaudio==2.7.1+cu128",
  "flash-attn==2.8.3",
  "omegaconf==2.3.0",
  "vocos==0.1.0",
  "vector_quantize_pytorch==1.27.20",
  "av==16.1.0",
  "setuptools==80.10.2",
  "wheel==0.46.3",
  "opencv-python==4.13.0.90",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
antlr4-python3-runtime = ["setuptools", "wheel"]
encodec = ["setuptools", "wheel"]
flash-attn = ["torch"]

[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "data",
  "demo",
  "engine",
  "models",
  "configs",
  "webpage",
]